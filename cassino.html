<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tigrin Deluxe</title>
<link rel="stylesheet" href="style.css">
<link rel="shortcut icon" href="https://tigrinho.io/wp-content/uploads/2024/06/tigrinho-812x1024.png" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>

<div class="containerAposta">
    <div class="glow"></div>
    <img src="https://portalcorreio.com.br/portalcorreio/storage/2023/08/c040639c8dc9522936f4a680b1888f1e.png" alt="" class="tigre">
    <div class="cassino">
        <div class="logo">TIGRIN PAGA MUITO</div>
        <div class="sub">DELUXE EDITION</div>
        <div class="grid" id="grid"></div>
    </div>
    <div class="msg" id="mensagem"></div>
    <div class="topo">
        <div class="box-info">
            <i class="fa-solid fa-wallet"></i>
            <div class="valor" id="saldo">R$100,00</div>
        </div>
        <div class="box-info">
            <i class="fa-solid fa-coins"></i>
            <div class="valor" id="aposta">R$10,00</div>
        </div>
    </div>
    <div class="btns">
        <button class="bet-btn" onclick="diminuirAposta()">-</button>
        <button onclick="girar()" class="btnG"></button>
        <button class="bet-btn" onclick="aumentarAposta()">+</button>
    </div>
</div>
    
<script src="script.js"></script>
    
</body>
</html>
